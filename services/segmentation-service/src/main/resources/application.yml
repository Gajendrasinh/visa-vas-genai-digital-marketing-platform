spring:
  application:
    name: segmentation-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/vasmkt}
    username: ${DB_USERNAME:svc_segment}
    # No default: the service refuses to start without a configured credential.
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: segment
        default_batch_fetch_size: 50
        jdbc:
          time_zone: UTC
  flyway:
    schemas: segment
    default-schema: segment
    create-schemas: false

server:
  port: ${SERVER_PORT:8082}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  structured:
    format:
      console: ecs

[project]
name = "ai-orchestrator"
version = "0.1.0"
description = "Agent orchestration (LangGraph) for the VAS marketing platform. Holds no LLM credentials; all model calls go through ai-gateway."
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.120",
  "uvicorn[standard]>=0.38",
  "pydantic-settings>=2.11",
]

[dependency-groups]
dev = [
  "pytest>=8.4",
  "pytest-cov>=7.0",
  "httpx2>=2.13",
  "ruff>=0.14",
  "mypy>=1.18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_orchestrator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=ai_orchestrator --cov-report=term-missing --cov-fail-under=80"

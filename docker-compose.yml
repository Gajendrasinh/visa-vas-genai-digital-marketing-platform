# Local development stack. Profiles keep memory within a laptop budget (docs/architecture.md §10.1):
#   core  - Postgres, Kafka (+ topic init), Schema Registry, Redis, Keycloak       (~2.2 GB)
#   aws   - LocalStack: S3, KMS, Secrets Manager, CloudWatch Logs (needs LOCALSTACK_AUTH_TOKEN)
# Further profiles (ai, obs, lake) are added in later phases. All secrets come from .env.
name: vasmkt

x-restart: &restart
  restart: unless-stopped

services:
  postgres:
    <<: *restart
    profiles: [core]
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: vasmkt
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?set in .env}
      SERVICE_DB_PASSWORD: ${SERVICE_DB_PASSWORD:?set in .env}
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=200", "-c", "log_min_duration_statement=500"]
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d vasmkt"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 256m

  kafka:
    <<: *restart
    profiles: [core]
    image: apache/kafka:4.3.1
    environment:
      CLUSTER_ID: vasmkt-local-kraft-01
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: -Xms384m -Xmx384m
    ports: ["127.0.0.1:9094:9094"]
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
    mem_limit: 768m

  kafka-init:
    profiles: [core]
    image: apache/kafka:4.3.1
    depends_on:
      kafka: { condition: service_healthy }
    entrypoint: ["/bin/bash", "/topics/create-topics.sh"]
    volumes:
      - ./infrastructure/docker/kafka:/topics:ro
    restart: "no"

  schema-registry:
    <<: *restart
    profiles: [core]
    image: confluentinc/cp-schema-registry:8.2.4
    depends_on:
      kafka: { condition: service_healthy }
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9092
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 1
      SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL: backward_transitive
      SCHEMA_REGISTRY_HEAP_OPTS: -Xms128m -Xmx256m
    ports: ["127.0.0.1:8085:8081"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/subjects > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
    mem_limit: 512m

  redis:
    <<: *restart
    profiles: [core]
    image: redis:7.4-alpine
    # volatile-lru: only keys with a TTL are evictable; every platform key has one (data-model.md §8).
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set in .env}", "--maxmemory", "96mb", "--maxmemory-policy", "volatile-lru", "--appendonly", "no"]
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    mem_limit: 128m

  keycloak:
    <<: *restart
    profiles: [core]
    image: quay.io/keycloak/keycloak:26.7.4
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:?set in .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set in .env}
      KEYCLOAK_DEMO_USER_PASSWORD: ${KEYCLOAK_DEMO_USER_PASSWORD:?set in .env}
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_PORT: 8080
      JAVA_OPTS_KC_HEAP: -Xms256m -Xmx512m
    ports: ["127.0.0.1:8180:8080"]
    volumes:
      - ./infrastructure/docker/keycloak/vasmkt-realm.json:/opt/keycloak/data/import/vasmkt-realm.json:ro
    healthcheck:
      # The image has no curl; use bash's /dev/tcp against the management port.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    mem_limit: 768m

  localstack:
    <<: *restart
    profiles: [aws]
    image: localstack/localstack:2026.08
    environment:
      # Required since LocalStack 2026.03 (free Hobby plan). `make up-core` skips this profile when empty.
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:-}
      SERVICES: s3,kms,secretsmanager,logs
      PLATFORM_ENV: local
    ports: ["127.0.0.1:4566:4566"]
    volumes:
      - ./infrastructure/docker/localstack/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4566/_localstack/init/ready | grep -q '\"completed\": true'"]
      interval: 10s
      timeout: 5s
      retries: 30
    mem_limit: 512m

volumes:
  pgdata:
  kafkadata:
